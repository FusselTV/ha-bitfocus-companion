[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# The Home Assistant core rule set, minus the ones core itself disables.
select = [
    "A", "ANN", "ASYNC", "B", "C4", "D", "E", "F", "FLY", "G", "I", "ICN",
    "INP", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PYI", "RET",
    "RSE", "RUF", "S", "SIM", "SLF", "SLOT", "T20", "TID", "TRY", "UP", "W",
]
ignore = [
    "ANN401",
    "D203",
    "D213",
    "E501",
    "ISC001",
    "PLR0911",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "D103", "PLR2004", "S101", "S105", "SLF001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
